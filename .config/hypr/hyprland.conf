----------------------
--- AUTOSTART --------
----------------------
-- exec-once has no direct keyword in Lua; hook the session-start event instead.
-- hl.exec_cmd() fires once, matching exec-once semantics (not hl.dsp.exec_cmd,
-- which is the bind-dispatcher variant).
hl.on("hyprland.start", function()
    hl.exec_cmd("hypridle")
    hl.exec_cmd("swaync")
    hl.exec_cmd("quickshell")
    hl.exec_cmd("hyprpaper")
    hl.exec_cmd("firefox")
    hl.exec_cmd("hyprpolkitagent")
    hl.exec_cmd("gsr-ui launch-hide-announce")
end)

