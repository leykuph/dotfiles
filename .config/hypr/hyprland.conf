----------------------
--- KEYBINDINGS ------
----------------------
-- NOTE: dispatcher names below marked "(verify)" are my best-effort mapping from
-- the old hyprlang dispatcher of the same purpose. hl.dsp.exec_cmd, hl.dsp.window.close,
-- hl.dsp.window.float, and the mouse-bind {mouse=true} pattern are confirmed against
-- the official example config / wiki. The movefocus/workspace/pseudo/fullscreen ones
-- are not confirmed in what I could pull up this session -- check
-- wiki.hypr.land/Configuring/Basics/Binds/ and the Dispatchers page before relying on
-- them, since a bad dispatcher name will abort loading of this whole file.

hl.bind(mainMod .. " + C", hl.dsp.exec_cmd(terminal))
hl.bind(mainMod .. " + Q", hl.dsp.window.close())
-- Old "exit" dispatcher: since you're launching Hyprland via uwsm now, stopping the
-- session cleanly is "uwsm stop" rather than a direct hl.dsp exit call.
hl.bind(mainMod .. " + M", hl.dsp.exec_cmd("uwsm stop"))
hl.bind(mainMod .. " + E", hl.dsp.exec_cmd(fileManager))
hl.bind(mainMod .. " + V", hl.dsp.window.float({ action = "toggle" }))
hl.bind(mainMod .. " + SPACE", hl.dsp.exec_cmd(menu))
-- "pseudo" isn't in the general/window dispatcher table -- it's dwindle-layout-specific
-- and wasn't documented in what I could pull. Leaving unbound for now rather than
-- guessing again; check wiki.hypr.land/Layouts/Dwindle-Layout for the Lua name.
-- hl.bind(mainMod .. " + P", hl.dsp.window.???())

hl.bind(mainMod .. " + L", hl.dsp.exec_cmd(browser))
hl.bind("Print", hl.dsp.exec_cmd("hyprshot -m region -z"))
hl.bind("End", hl.dsp.exec_cmd('grim ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png'))
-- fullscreen({ mode?, action?, window? }) confirmed to exist; exact enum values for
-- mode/action weren't in what I pulled, so this may need a mode="fullscreen" or
-- action="toggle" field -- test this one specifically after reload.
hl.bind(mainMod .. " + F", hl.dsp.window.fullscreen({}))
hl.bind(mainMod .. " + N", hl.dsp.exec_cmd("swaync-client -t"))

-- Focus movement -- confirmed: hl.dsp.focus({ direction = ... })
local dirs = { left = "l", right = "r", up = "u", down = "d" }
for key, dir in pairs(dirs) do
    hl.bind(mainMod .. " + " .. key, hl.dsp.focus({ direction = dir }))
end

-- Workspace switch + move-to-workspace, 1-9 and 0->10
-- confirmed: hl.dsp.focus({ workspace = ... }) switches workspace,
-- hl.dsp.window.move({ workspace = ... }) moves the active window to one.
for i = 1, 10 do
    local wsNum = i % 10  -- 10 -> 0 on the keyboard
    hl.bind(mainMod .. " + " .. tostring(wsNum), hl.dsp.focus({ workspace = tostring(i) }))
    hl.bind(mainMod .. " + SHIFT + " .. tostring(wsNum), hl.dsp.window.move({ workspace = tostring(i) }))
end

hl.bind(mainMod .. " + S", hl.dsp.workspace.toggle_special("magic"))
hl.bind(mainMod .. " + SHIFT + S", hl.dsp.window.move({ workspace = "special:magic" }))

-- Old "e+1"/"e-1" was empty-aware, per-monitor relative cycling. The plain relative
-- selector below ("+1"/"-1") is the closest confirmed equivalent but may not be
-- exactly the same edge-case behavior -- worth testing with several workspaces open.
hl.bind(mainMod .. " + mouse_down", hl.dsp.focus({ workspace = "+1" }))
hl.bind(mainMod .. " + mouse_up", hl.dsp.focus({ workspace = "-1" }))

-- These two weren't in the confirmed general/window dispatcher table either --
-- flagging them now before you hit the same nil-value error on reload.
hl.bind(mainMod .. " + mouse:272", hl.dsp.window.drag(),   { mouse = true })  -- (verify)
hl.bind(mainMod .. " + mouse:273", hl.dsp.window.resize(), { mouse = true })  -- (verify)

-- Media / brightness (locked = works on lockscreen, repeating = held-key repeat)
hl.bind("XF86AudioRaiseVolume",   hl.dsp.exec_cmd("wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+"), { locked = true, repeating = true })
hl.bind("XF86AudioLowerVolume",   hl.dsp.exec_cmd("wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"),      { locked = true, repeating = true })
hl.bind("XF86AudioMute",          hl.dsp.exec_cmd("wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"),     { locked = true, repeating = true })
hl.bind("XF86AudioMicMute",       hl.dsp.exec_cmd("wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"),   { locked = true, repeating = true })
hl.bind("XF86MonBrightnessUp",    hl.dsp.exec_cmd("brightnessctl -e4 -n2 set 5%+"),                  { locked = true, repeating = true })
hl.bind("XF86MonBrightnessDown",  hl.dsp.exec_cmd("brightnessctl -e4 -n2 set 5%-"),                  { locked = true, repeating = true })

hl.bind("XF86AudioNext",  hl.dsp.exec_cmd("playerctl next"),       { locked = true })
hl.bind("XF86AudioPause", hl.dsp.exec_cmd("playerctl play-pause"), { locked = true })
hl.bind("XF86AudioPlay",  hl.dsp.exec_cmd("playerctl play-pause"), { locked = true })
hl.bind("XF86AudioPrev",  hl.dsp.exec_cmd("playerctl previous"),   { locked = true })

